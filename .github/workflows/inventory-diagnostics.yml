name: Inventory Test Diagnostics

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out tested commit
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Capture test groups
        shell: bash
        run: |
          set +e
          : > inventory-test-diagnostics.txt

          echo '=== UNIT ===' >> inventory-test-diagnostics.txt
          npm run test:unit >> inventory-test-diagnostics.txt 2>&1
          echo "UNIT_EXIT=$?" >> inventory-test-diagnostics.txt

          echo '=== STATIC DATABASE CONTRACTS ===' >> inventory-test-diagnostics.txt
          npm run test:db:static >> inventory-test-diagnostics.txt 2>&1
          echo "STATIC_EXIT=$?" >> inventory-test-diagnostics.txt

          echo '=== MIGRATION HISTORY ===' >> inventory-test-diagnostics.txt
          npm run test:migrations >> inventory-test-diagnostics.txt 2>&1
          echo "MIGRATIONS_EXIT=$?" >> inventory-test-diagnostics.txt

          echo '=== VANITA CHECKS ===' >> inventory-test-diagnostics.txt
          npm run test:vanita >> inventory-test-diagnostics.txt 2>&1
          echo "VANITA_EXIT=$?" >> inventory-test-diagnostics.txt

          exit 0

      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: inventory-test-diagnostics
          path: inventory-test-diagnostics.txt
          retention-days: 1
