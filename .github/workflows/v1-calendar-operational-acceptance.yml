name: BDB OS V1 Calendar Operational Acceptance

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bdb-v1-calendar-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  authenticated-calendar-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          show-progress: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked application dependencies
        run: npm ci

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.84.2
          github-token: ${{ github.token }}

      - name: Start disposable Supabase and replay all migrations
        run: supabase start

      - name: Configure exact-candidate Calendar acceptance environment
        shell: bash
        run: |
          set -euo pipefail
          supabase status -o env > /tmp/supabase.env
          source /tmp/supabase.env
          test -n "$API_URL"
          test -n "$ANON_KEY"
          test -n "$SERVICE_ROLE_KEY"
          PASSWORD="CalendarAcceptance-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT!"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$ANON_KEY"
            echo "SUPABASE_SECRET_KEY=$SERVICE_ROLE_KEY"
            echo "NEXT_PUBLIC_APP_URL=http://127.0.0.1:3000"
            echo "NEXT_PUBLIC_SITE_URL=http://127.0.0.1:3000"
            echo "BDB_E2E_BASE_URL=http://127.0.0.1:3000"
            echo "BDB_E2E_OWNER_EMAIL=v1-calendar-acceptance@bdb.invalid"
            echo "BDB_E2E_OWNER_PASSWORD=$PASSWORD"
            echo "BDB_E2E_WORKSPACE_NAME=V1 Calendar Acceptance"
          } >> "$GITHUB_ENV"

      - name: Create disposable authenticated owner workspace
        shell: bash
        run: |
          set -euo pipefail
          source /tmp/supabase.env
          USER_JSON="$(curl --fail --silent --show-error             -X POST "$API_URL/auth/v1/admin/users"             -H "apikey: $SERVICE_ROLE_KEY"             -H "Authorization: Bearer $SERVICE_ROLE_KEY"             -H "Content-Type: application/json"             --data "$(python -c 'import json,os; print(json.dumps({"email":os.environ["BDB_E2E_OWNER_EMAIL"],"password":os.environ["BDB_E2E_OWNER_PASSWORD"],"email_confirm":True}))')")"
          USER_ID="$(printf '%s' "$USER_JSON" | python -c 'import json,sys; print(json.load(sys.stdin)["id"])')"
          test -n "$USER_ID"
          DB_CONTAINER="$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -n 1)"
          test -n "$DB_CONTAINER"
          docker exec -i "$DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 -v owner_id="$USER_ID" <<'SQL'
          update public.profiles
          set full_name = 'V1 Calendar Acceptance Owner', is_active = true
          where id = :'owner_id'::uuid;

          insert into public.workspaces(id, slug, name)
          values ('63000000-0000-4000-8000-000000000001'::uuid, 'v1-calendar-acceptance', 'V1 Calendar Acceptance');

          update public.workspaces
          set status = 'active',
              plan_id = (select plan_id from public.workspaces where slug = 'bdb-os')
          where id = '63000000-0000-4000-8000-000000000001'::uuid;

          insert into public.workspace_memberships(workspace_id, user_id, role, status, access_profile, joined_at)
          values (
            '63000000-0000-4000-8000-000000000001'::uuid,
            :'owner_id'::uuid,
            'owner', 'active', 'owner', now()
          );
          SQL

      - name: Install Chromium test runner
        shell: bash
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.55.0
          grep -rl 'dl\.google\.com/linux/chrome' /etc/apt/sources.list.d 2>/dev/null | xargs -r sudo rm -f
          npx playwright install --with-deps chromium

      - name: Build exact candidate
        run: npm run build

      - name: Start exact candidate
        shell: bash
        run: |
          npm start > /tmp/bdb-os-calendar-acceptance.log 2>&1 &
          echo $! > /tmp/bdb-os-calendar-acceptance.pid
          for attempt in {1..45}; do
            if curl --fail --silent http://127.0.0.1:3000/login > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/bdb-os-calendar-acceptance.log
          exit 1

      - name: Run authenticated Calendar Operational Acceptance
        run: npx playwright test tests/e2e/calendar-operational-acceptance.spec.ts --project=chromium

      - name: Upload Calendar acceptance browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v1-calendar-operational-acceptance-report
          path: |
            playwright-report
            test-results
            /tmp/bdb-os-calendar-acceptance.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop disposable Supabase
        if: always()
        run: supabase stop --no-backup
